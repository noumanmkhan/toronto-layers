html,body{height:100%}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.4;overflow:hidden}
#app{position:relative;height:100%}
#map{position:absolute;inset:0;background:var(--water)}
.leaflet-container{background:var(--water);font-family:var(--font)}
.leaflet-container :focus-visible{outline:2px solid var(--focus)}
.leaflet-control-zoom{box-shadow:var(--shadow)!important;border:1px solid var(--rule)!important}
.leaflet-bottom.leaflet-left .leaflet-control-zoom{margin:0 0 26px 332px}
@media (max-width:760px){.leaflet-control-zoom{display:none}}
.leaflet-control-zoom a{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--rule)!important}
.leaflet-bar{box-shadow:var(--shadow)!important;border:none!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent)!important;color:var(--ink-3)!important;font-size:10.5px}
.leaflet-control-attribution a{color:var(--ink-2)!important}

/* ---------- panel ---------- */
#panel{position:absolute;z-index:1000;top:16px;left:16px;bottom:16px;width:300px;display:flex;flex-direction:column;
  background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;overflow:clip}
.ph{padding:18px 18px 12px;border-bottom:1px solid var(--rule)}
.ph h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--ink-2);font-size:12.5px}
.ph .grab{display:none}
/* City switcher: a native dropdown laid invisibly over the title, so phones get their own picker. */
.hub-link{display:flex;width:max-content;align-items:center;gap:3px;margin:0 0 6px -2px;font-size:11.5px;font-weight:600;color:var(--ink-3);text-decoration:none}
.hub-link svg{width:13px;height:13px}
.hub-link:hover{color:var(--accent)}
.hub-link:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.switch{position:relative;display:inline-block;max-width:100%}
.switch h1{display:flex;align-items:center;gap:6px}
.switch .chev{flex:none;width:16px;height:16px;color:var(--ink-3);transition:transform .15s,color .15s}
.switch:hover .chev{color:var(--accent);transform:translateY(1px)}
.switch select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;appearance:none;border:none}
.switch:focus-within h1{outline:2px solid var(--focus);outline-offset:3px;border-radius:6px}
#layers{overflow:auto;padding:6px 10px 14px;flex:1;min-height:0}
.grp{margin-top:10px}
.grp h2{margin:8px 8px 4px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.row{position:relative;display:flex;align-items:flex-start;gap:10px;padding:8px;border-radius:9px;cursor:pointer;user-select:none}
.row:hover{background:var(--pill-bg)}
/* The real checkbox sits invisibly over its own switch, so focusing it never scrolls anything but the list. */
.row input{position:absolute;top:10px;right:8px;width:32px;height:18px;margin:0;opacity:0;pointer-events:none}
.sw{flex:none;width:30px;height:22px;border-radius:6px;position:relative;overflow:hidden;border:1px solid var(--rule)}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:600;font-size:13.5px}
.tx span{display:block;color:var(--ink-3);font-size:11.5px;margin-top:1px}
.tg{flex:none;width:32px;height:18px;border-radius:9px;background:var(--rule);position:relative;margin-top:2px;transition:background .15s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.row input:checked ~ .tg{background:var(--accent)}
.row input:checked ~ .tg::after{transform:translateX(14px)}
.row input:focus-visible ~ .tg{outline:2px solid var(--focus);outline-offset:2px}
.sub{margin:-4px 0 4px 48px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);cursor:pointer}
.sub input{accent-color:var(--accent);margin:0}
.pf{padding:10px 18px 14px;border-top:1px solid var(--rule);font-size:11px;color:var(--ink-3)}
.pf button{font:inherit;color:var(--ink-2);background:none;border:1px solid var(--rule);border-radius:7px;padding:4px 9px;cursor:pointer}
.pf button:hover{color:var(--ink)}
.pfb{display:flex;gap:6px;flex-wrap:wrap}
.pf{position:relative}
.imgmenu{position:absolute;left:12px;right:12px;bottom:calc(100% + 6px);background:var(--panel);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:12px;display:grid;gap:4px;font-size:12px;color:var(--ink-2);z-index:5}
.imgmenu[hidden]{display:none}
.imgmenu b{color:var(--ink);font-size:12.5px}
.imgmenu div{display:flex;gap:6px;margin-top:6px}
.pf .imgmenu button{flex:1;padding:6px 8px;font-weight:600;color:var(--ink)}
.imgmenu .shape{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:6px}
.pf .imgmenu .shape button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px 6px;font-size:11px;font-weight:500;color:var(--ink-2)}
.pf .imgmenu .shape button[aria-checked="true"]{background:var(--pill-bg);color:var(--ink);font-weight:700;border-color:var(--ink-3)}
.shape i{display:block;border:1.6px solid currentColor;border-radius:2px;height:20px}
.shape .sh-wide{width:30px;height:17px;margin:1.5px 0}.shape .sh-square{width:20px}.shape .sh-portrait{width:16px}.shape .sh-story{width:11px}
/* Desktop: the layer panel folds away to a small "Layers" button, leaving the whole map. */
.ph{position:relative}
.fold{position:absolute;top:12px;right:12px;width:28px;height:28px;display:grid;place-items:center;border:none;border-radius:7px;background:none;color:var(--ink-3);cursor:pointer}
.fold:hover{background:var(--pill-bg);color:var(--ink)}
.fold svg{width:15px;height:15px}
#panel.folded{display:none}
#unfold{position:absolute;z-index:1000;top:16px;left:16px;display:flex;align-items:center;gap:7px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--panel);border:none;border-radius:10px;box-shadow:var(--shadow);padding:9px 13px;cursor:pointer}
#unfold[hidden]{display:none}
#unfold svg{width:15px;height:15px}
#busy{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;background:var(--bg)}
#busy[hidden]{display:none}
#busy span{font-size:14px;font-weight:600;color:var(--ink-2)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,8px);background:var(--ink);color:var(--panel);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:2000}
#toast.on{opacity:1;transform:translate(-50%,0)}
.pf{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;padding:2px;gap:2px}
.pf .seg button{border:none;border-radius:6px;padding:4px 8px;font-size:11.5px}
.pf .seg button[aria-checked="true"]{background:var(--pill-bg);color:var(--ink);font-weight:600}

/* swatches */
/* each city colours its own fill layers, transit lines and their swatches (cities/<city>/city.css) */
.sw.k-units{background:var(--city);background-image:linear-gradient(var(--nbhd) 1px,transparent 1px),linear-gradient(90deg,var(--nbhd) 1px,transparent 1px);background-size:9px 8px;background-position:3px 3px}

.sw.k-city{background:var(--city);box-shadow:inset 0 0 0 2px var(--ward)}
.sw.k-state{background:var(--city);background-image:repeating-linear-gradient(90deg,var(--prov) 0 4px,transparent 4px 7px);background-size:100% 2px;background-repeat:no-repeat;background-position:0 50%}
.sw.k-national{background:var(--city);box-shadow:inset 0 0 0 2px var(--fed)}
.sw.k-districts{background:color-mix(in srgb,var(--hd) 16%,var(--city));box-shadow:inset 0 0 0 1.5px var(--hd)}
.sw.k-boards{background:var(--city);box-shadow:inset 0 0 0 2px var(--sbw)}
.sw.k-patches{background:color-mix(in srgb,var(--bia) 45%,var(--city))}
.sw.k-streets{background:var(--city);background-image:linear-gradient(var(--st-case),var(--st-case)),linear-gradient(var(--st),var(--st));background-size:100% 5px,100% 3px;background-position:0 50%,0 50%;background-repeat:no-repeat}
.sw.k-highways{background:var(--city);background-image:linear-gradient(var(--hwy-case),var(--hwy-case)),linear-gradient(var(--hwy),var(--hwy));background-size:100% 6px,100% 2px;background-position:0 50%,0 50%;background-repeat:no-repeat}
.sw.k-landmarks{background:var(--panel);display:grid;place-items:center;color:var(--lm-culture)}
.sw.k-landmarks svg{width:14px;height:14px}

/* ---------- map styling (CSS overrides Leaflet's SVG attributes, so both themes work) ---------- */
.base-out{fill:var(--land-out);fill-opacity:1;stroke:var(--land-out-line);stroke-width:1}
.base-far{fill:var(--land-far);fill-opacity:1;stroke:none}
.base-city{fill:var(--city);fill-opacity:1;stroke:var(--city-line);stroke-width:1.6}
.fill-major{fill-opacity:.55;stroke:var(--city);stroke-width:2}
.fill-minor{fill-opacity:.6;stroke:var(--city);stroke-width:2}
.nbhd{fill:var(--nbhd-fill);fill-opacity:0;stroke:var(--nbhd);stroke-width:.9;stroke-opacity:.7}
.nbhd:hover{fill-opacity:.12}
.ward{fill:var(--ward);fill-opacity:0;stroke:var(--ward);stroke-width:2.2}
.ward:hover{fill-opacity:.08}
.prov{fill:var(--prov);fill-opacity:0;stroke:var(--prov);stroke-width:2;stroke-dasharray:6 4}
.prov:hover{fill-opacity:.08}
.fed{fill:var(--fed);fill-opacity:0;stroke:var(--fed);stroke-width:2.2;stroke-dasharray:1 0}
.fed:hover{fill-opacity:.08}
.sbw{fill:var(--sbw);fill-opacity:0;stroke:var(--sbw);stroke-width:2.6;stroke-dasharray:9 4}
.sbw:hover{fill-opacity:.08}
.bia{fill:var(--bia);fill-opacity:.45;stroke:var(--bia);stroke-width:1.2}
.bia:hover{fill-opacity:.7}
.hd{fill:var(--hd);fill-opacity:.14;stroke:var(--hd);stroke-width:1.6;stroke-dasharray:4 3}
.hd:hover{fill-opacity:.28}
.st-case{stroke:var(--st-case);fill:none;stroke-linecap:round;stroke-linejoin:round}
.st-core{stroke:var(--st);fill:none;stroke-linecap:round;stroke-linejoin:round}
#map:not(.z12) .st-case.minor,#map:not(.z12) .st-core.minor{display:none}
#map:not(.z13) .st-case.coll,#map:not(.z13) .st-core.coll{display:none}
.sw.k-streets.coll{background-size:100% 3.5px,100% 1.8px}
.st-lbl{position:absolute;left:0;top:0;display:block;white-space:nowrap;pointer-events:none;font:600 11.5px/1 var(--font);color:var(--ink);
  text-shadow:0 0 2px var(--city),0 0 3px var(--city),0 0 5px var(--city)}
.st-lbl.minor{font-weight:500;font-size:10.5px;color:var(--ink-2)}
.st-lbl.coll{font-weight:500;font-size:10px;color:var(--ink-2)}
.hwy-case{stroke:var(--hwy-case);fill:none;stroke-linecap:round;stroke-linejoin:round}
.hwy-core{stroke:var(--hwy);fill:none;stroke-linecap:round;stroke-linejoin:round}
.sub-line{fill:none;stroke-linecap:round;stroke-linejoin:round}
.stn{fill:var(--station);stroke:var(--ink);stroke-width:1.5}
.stn.x{stroke-width:2.2}
.pin{display:block;width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 28%,transparent),0 2px 8px rgba(0,0,0,.4)}

/* labels */
.leaflet-tooltip.lbl{background:none;border:none;box-shadow:none;padding:0;color:var(--ink);font-family:var(--font);white-space:nowrap;pointer-events:none;
  text-shadow:0 0 2px var(--city),0 0 3px var(--city),0 0 5px var(--city)}
.leaflet-tooltip.lbl::before{display:none}
.lbl-boro{font-size:15px;font-weight:800;letter-spacing:-.01em}
.lbl-area{font-size:13px;font-weight:700}
.lbl-nbhd{font-size:10.5px;font-weight:500;color:var(--ink-2)!important;max-width:120px;white-space:normal!important;text-align:center;line-height:1.15}
.lbl-cult{font-size:11.5px;font-weight:600;font-style:italic;color:var(--cult)!important}
.lbl-cult.enclave{color:var(--cult-enclave)!important}
.lbl-ward{font-size:11px;font-weight:700;color:var(--ward)!important}
.lbl-prov{font-size:11px;font-weight:700;color:var(--prov)!important}
.lbl-fed{font-size:11px;font-weight:700;color:var(--fed)!important}
.lbl-sbw{font-size:11px;font-weight:700;color:var(--sbw)!important}
.lbl-bia{font-size:10px;font-weight:600;color:var(--bia)!important}
.lbl-hd{font-size:10px;font-weight:600;font-style:italic;color:var(--hd)!important}
.lbl-stn{font-size:10px;font-weight:600}
.lbl-stn.end{font-size:11px;font-weight:700}
.stn.end{stroke-width:2.6}
.lm{display:flex;align-items:center;gap:6px;white-space:nowrap;transform:translate(-11px,-11px)}
.lm i{display:grid;place-items:center;flex:none;width:22px;height:22px;border-radius:50%;background:var(--panel);color:var(--lm);box-shadow:0 0 0 1.5px var(--lm),0 1px 3px rgba(0,0,0,.25)}
.lm i svg{width:13px;height:13px}
.lm b{font:700 11.5px/1.15 var(--font);color:var(--ink);text-shadow:0 0 2px var(--city),0 0 3px var(--city),0 0 5px var(--city)}
.clash{visibility:hidden!important}
.lm.sports{--lm:var(--lm-sports)} .lm.park{--lm:var(--lm-park)} .lm.music{--lm:var(--lm-music)} .lm.civic{--lm:var(--lm-civic)}
.lm.in-university{--lm:var(--in-university)} .lm.in-college{--lm:var(--in-college)} .lm.in-hospital{--lm:var(--in-hospital)}
.lm.inst i{width:18px;height:18px} .lm.inst i svg{width:11px;height:11px} .lm.inst{transform:translate(-9px,-9px)} .lm.inst b{font-size:10.5px;font-weight:600}
.lm.inst.ed i{box-shadow:0 0 0 2.5px var(--lm),0 1px 3px rgba(0,0,0,.25)}
#map:not(.z11) .lm.inst,#map:not(.z14) .lm.inst b{display:none}
.sw.k-places{background:var(--panel);display:grid;place-items:center}
/* Skyscrapers: square badges. Filled = open; dashed and hollow = under construction; gold ring = 300 m+. */
.lm.tw{transform:translate(-8px,-8px)}
.lm.tw.u-res{--lm:var(--tw-res)} .lm.tw.u-com{--lm:var(--tw-com)} .lm.tw.u-mix{--lm:var(--tw-mix)}
.lm.tw i{box-sizing:border-box;width:16px;height:16px;border-radius:4px;background:var(--lm);color:var(--panel);box-shadow:0 0 0 1.5px var(--panel),0 1px 3px rgba(0,0,0,.3)}
.lm.tw i svg{width:11px;height:11px}
.lm.tw.uc i{background:var(--panel);color:var(--lm);border:1.5px dashed var(--lm);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.lm.tw.sup{transform:translate(-10px,-10px)}
.lm.tw.sup i{width:20px;height:20px;box-shadow:0 0 0 1.5px var(--panel),0 0 0 3.5px var(--tw-sup),0 1px 4px rgba(0,0,0,.3)}
.lm.tw.sup i svg{width:13px;height:13px}
.lm.tw b{font-size:10.5px;font-weight:600} .lm.tw.sup b{font-size:11.5px;font-weight:700}
#map:not(.z12) .lm.tw.sup,#map:not(.z14) .lm.tw:not(.sup),#map:not(.z13) .lm.tw.sup b,#map:not(.z15) .lm.tw:not(.sup) b{display:none}
.sw.k-towers{background:var(--panel);display:grid;place-items:center;color:var(--tw-com)}
.row.child{margin-left:16px} .lensbox.child{margin-left:64px}
.twkey .lm.tw{transform:none;display:inline-flex} .twkey .lm.tw i{width:16px;height:16px;border-radius:4px} .twkey .lm.tw.sup i{width:16px;height:16px} .twkey .lm.tw.sup i svg{width:11px;height:11px} .sw.in-university{color:var(--in-university)} .sw.in-college{color:var(--in-college)} .sw.in-hospital{color:var(--in-hospital)}
.sw.k-places svg{width:14px;height:14px}
.lm.campus{--lm:var(--lm-campus)} .lm.culture{--lm:var(--lm-culture)} .lm.airport{--lm:var(--ink)}
#map:not(.z11) .lm.t1,#map:not(.z13) .lm.t2,#map:not(.z13) .lm.t1 b,#map:not(.z14) .lm.t2 b{display:none}
.lbl-muni{font-size:13px;font-weight:500;font-style:italic;color:var(--muni-label)!important;text-shadow:none}
.lbl-region{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muni-label)!important;text-shadow:none}
.lbl-lake{font-size:24px;font-weight:600;font-style:italic;color:color-mix(in srgb,var(--water) 40%,#2F7FD8)!important;text-shadow:none;letter-spacing:.02em}
.shield{display:grid;place-items:center;height:18px;min-width:26px;padding:0 4px;border-radius:5px;background:var(--shield);color:#fff;
  font:700 10.5px/1 var(--font);box-shadow:0 0 0 1.5px #fff;white-space:nowrap}
.shield.city{background:var(--shield-city)}
.shield.toll{background:var(--shield-toll)}
.go-line{fill:none;stroke-linecap:round;stroke-linejoin:round}
/* Transit under construction: dashed line over a casing, hollow stations */
.cx-case{fill:none;stroke:var(--city);stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.cx-line{fill:none;stroke-linecap:butt;stroke-linejoin:round}
.cx-stn{fill:var(--city);stroke-width:2.2}
.lbl-cx{font-style:italic}
.leaflet-container:not(.z13) .lbl-cx{display:none}
/* Closures: red for closed, amber dashes for lanes narrowed; local streets only from zoom 15; faint if starting soon */
.cl{fill:none;stroke-linecap:round;stroke-linejoin:round}
.cl.closed{stroke:var(--cl-closed)}
.cl.narrowed{stroke:var(--cl-narrow);stroke-dasharray:2 7}

/* A small road-work diamond marks each permit until zoom 15, where the stretch itself is visible */

.cl-pin.closed{background:var(--cl-closed)} .cl-pin.narrowed{background:var(--cl-narrow)} .cl-pin.soon{opacity:.5}
.z15 .cl-pin,.leaflet-container:not(.z12) .cl-pin{display:none}
.leaflet-container:not(.z11) .cx-stn{display:none}
/* Streetcars and buses: lines in the mode's colour, numbered badges from zoom 12, stops from zoom 15.
   A picked route is drawn in ink over a casing, with its badges and stops at any zoom from 13. */
.rt{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.8px}
.rt.bus{stroke:var(--bus)} .rt.tram{stroke:var(--tram);stroke-width:2.4px}
.rt.exp{stroke-dasharray:7 5;stroke-linecap:butt}
#map.z12 .rt{stroke-width:2.4px} #map.z12 .rt.tram{stroke-width:3px}
#map.z14 .rt{stroke-width:3.2px} #map.z14 .rt.tram{stroke-width:4px}
.rt-case{fill:none;stroke:var(--city);stroke-linecap:round;stroke-linejoin:round;stroke-width:3.4px;opacity:.85}
.rt-case.tram{stroke-width:4.4px} #map.z12 .rt-case{stroke-width:4.4px} #map.z12 .rt-case.tram{stroke-width:5.4px}
#map.z14 .rt-case{stroke-width:5.6px} #map.z14 .rt-case.tram{stroke-width:6.8px}
.rt.pick,#map.z12 .rt.pick{stroke:var(--ink);stroke-width:3.6px} #map.z14 .rt.pick{stroke-width:5px}
.rt-case.pick,#map.z12 .rt-case.pick{stroke-width:8px;opacity:.9} #map.z14 .rt-case.pick{stroke-width:10px}
.rt-b{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:grid;place-items:center;box-sizing:border-box;height:15px;min-width:19px;padding:0 3px;border-radius:4px;
  background:var(--bus);color:#fff;font:700 10px/1 var(--font);white-space:nowrap;box-shadow:0 0 0 1.5px var(--city)}
.rt-b.tram{background:var(--tram)} .rt-b.pick{background:var(--ink);color:var(--panel);height:17px;font-size:11px}
#map:not(.z12) .rt-b:not(.pick){display:none}
.rt-b{cursor:pointer}
/* One route shown alone: the rest fade back, their numbers hide */
#map.rt-focus .rt:not(.focus),#map.rt-focus .rt-case:not(.focus){opacity:.12}
#map.rt-focus .rt-b:not(.focus){display:none}
#map.rt-focus .rt-b.focus{display:grid}
.stop{fill:var(--city);stroke-width:1.6} .stop.bus{stroke:var(--bus)} .stop.tram{stroke:var(--tram)} .stop.pick{stroke:var(--ink);stroke-width:2}
.sw.k-streetcars{background:var(--city) linear-gradient(var(--tram),var(--tram)) 0 50%/100% 4px no-repeat}
.sw.k-buses{background:var(--city) linear-gradient(var(--bus),var(--bus)) 0 50%/100% 3px no-repeat}
#busbox .chips{gap:3px;flex-wrap:nowrap} #busbox .chips button{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:3px 5.5px;font-size:11px} #busbox{gap:6px}
.buspick{display:grid;gap:4px} .buspick small{font-size:10.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}

.scope button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.mask{fill:var(--land-out);fill-opacity:.94;stroke:var(--land-out-line);stroke-width:1}

/* ---------- readout ---------- */
/* #side runs to the bottom of the screen so the card can scroll inside it; the gap below the card stays tappable. */
#side{position:absolute;z-index:1000;top:16px;right:16px;bottom:16px;width:320px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
#side>*{pointer-events:auto;flex:none}
#here{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);flex:0 1 auto;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:transparent transparent;transition:scrollbar-color .2s}
#here:hover,#here:focus-within,#here.scrolling{scrollbar-color:var(--scroll-thumb) transparent}
#here::-webkit-scrollbar{width:10px}
#here::-webkit-scrollbar-track{background:transparent;margin:14px 0}

.tw-what em::before{content:"·";color:var(--ink-3);margin-right:6px}

.tw-stats dt{font-size:10.5px;color:var(--ink-3);letter-spacing:.02em}
.tw-stats dd{margin:1px 0 0;font-size:15px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.tw-stats dd small{display:block;font-size:11px;font-weight:400;color:var(--ink-3)}
.tw-facts{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:12.5px;line-height:1.4;color:var(--ink)}
.tw-facts li{display:flex;gap:7px} .tw-facts li::before{content:"";flex:none;width:5px;height:5px;margin-top:7px;border-radius:50%;background:var(--accent)}
.tw-src{font-size:11px;color:var(--ink-3)} .tw-src a{color:inherit}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;background:var(--pill-bg);font-weight:600;font-size:12.5px}
.pill i{width:9px;height:9px;border-radius:50%;flex:none}
dl.facts{margin:0;padding:10px 16px 14px;border-top:1px solid var(--rule);display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px}
dl.facts dt{color:var(--ink-3)}
dl.facts dd{margin:0;font-weight:500;min-width:0}
.sec{border-top:1px solid var(--rule)}
.sec>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);user-select:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:'';width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
.sec[open]>summary::after{transform:rotate(-135deg) translate(-1px,-1px)}
.sec>summary:hover{color:var(--ink-2)}
.sec>summary:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.sec dl.facts{border-top:none;padding-top:0}
.reps a{color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:2px}
.reps a:hover{text-decoration-color:currentColor}
.reps a::after{content:' \2197';font-size:10px;color:var(--ink-3)}
.reps dd b{font-weight:600}
.reps details.cands summary{cursor:pointer;color:var(--ink);font-weight:600}
.reps details.cands > span{margin:2px 0 3px;color:var(--ink-2)}
.reps .vacant{color:var(--ink-2);font-weight:500;font-style:italic}
.hint{padding:12px 16px 14px;color:var(--ink-2);font-size:12.5px;border-top:1px solid var(--rule)}

@media (max-width:760px){
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:46%;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  #panel.collapsed #layers,#panel.collapsed .pf{display:none}
  #panel.collapsed .focus-list,#panel.collapsed .focus-res{display:none}
  #panel.collapsed .pf-inv{display:none}
  .pf-inv{max-height:180px}
  .ph{padding:8px 16px 10px;cursor:pointer}
  .ph .grab{display:block;width:36px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 8px}
  .ph h1{font-size:17px}
  .ph p{display:none}
  .ph .hub-link{display:none}
  .fold,#unfold{display:none!important}
  #panel.folded{display:flex}
  #side{top:12px;left:12px;right:12px;bottom:calc(var(--panel-h,0px) + 8px);width:auto;gap:8px}

  .leaflet-top.leaflet-left{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* City Layers map engine. Everything city-specific comes from CITY (cities/<city>/city.json),
   inlined above this script by engine/assemble.py, and from the city's data/ folder. */

const DATA = 'data/';
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* Text templates from the config: "{name}" fills from a feature's properties, "{f.num}" walks into
   nested objects, a list becomes "a, b". A part in [square brackets] is dropped when a field inside it
   is missing; a missing field outside brackets blanks the whole text. */
function fill(tpl, ctx){
  const val = k => k.split('.').reduce((o, p) => o == null ? undefined : o[p], ctx);
  const sub = (s, miss) => s.replace(/\{([\w.]+)\}/g, (m, k) => {
    const v = val(k);
    if (v == null || v === '') { miss(); return ''; }
    return Array.isArray(v) ? v.join(', ') : v;
  });
  let missing = false;
  const out = sub(tpl.replace(/\[([^\]]*)\]/g, (m, inner) => { let gone = false; const r = sub(inner, () => { gone = true; }); return gone ? '' : r; }), () => { missing = true; });
  return missing ? '' : out;
}

const LAYERS = CITY.groups.flatMap(([, items]) => items);
const byKind = k => LAYERS.find(it => it.kind === k);
const UNITS = byKind('units'), METRO = byKind('metro');

   board. The panel shows one board at a time (it.boards: [id, short, long], the first is the default);
   the card looks up the spot's ward in every board. */
const BOARDS = LAYERS.filter(it => it.kind === 'boards');
const boardPick = {};
BOARDS.forEach(it => { boardPick[it.id] = it.boards[0][0]; });
const boardOf = (it, id) => it.boards.find(b => b[0] === id);
const boardCtx = (it, f) => { const b = boardOf(it, f.properties.board) || []; return Object.assign({}, f.properties, {short: b[1], long: b[2]}); };
function boardHits(it, x, y){
  const out = {}, fc = data.layers[it.id]; if (!fc) return out;
  fc.features.forEach(f => { if (!out[f.properties.board] && contains(f.geometry, x, y)) out[f.properties.board] = f; });

}

   share into the lens's tiers. Every other lens reads a precomputed tier, d[L_.key]. */
const pick = {};
CITY.lens.lenses.forEach(L_ => { if (L_.pick) pick[L_.id] = L_.pick[0][0]; });
function keyOf(L_, d){
  if (!d) return null;
  if (!L_.pick) return d[L_.key];
  const i = L_.pick.findIndex(p => p[0] === pick[L_.id]), v = d[L_.field] && d[L_.field][i];
  if (v == null) return null;
  const t = L_.cuts.findIndex(c => v < c);
  return L_.tiers[t < 0 ? L_.tiers.length - 1 : t][0];
}

  return !filt[f.lens].size || filt[f.lens].has(keyOf(L_, d));
});

/* Label declutter: after each move, place labels in priority order and hide any that would overlap
   a label already placed. Icons stay; hovering an icon still shows its name. */
const LABEL_PRIORITY = ['.lbl-focus', '.rt-b.pick', '.lm.t1 b', '.lm.t2 b', '.lm.tw.sup b', '.lm.inst b', '.lm.tw b', '.lbl-stn.end', '.lbl-go.end', '.shield', '.lbl-stn', '.lbl-go', '.rt-b', '.lbl-cult', '.lbl-area', '.lbl-nbhd', '.lbl-ward, .lbl-prov, .lbl-fed, .lbl-sbw', '.lbl-bia', '.lbl-hd'];
let declutterQueued = false;
function declutter(){
  declutterQueued = false;
  const box = map.getContainer().getBoundingClientRect(), kept = [], seen = new Set();
  const el = map.getContainer();
  el.querySelectorAll('.clash').forEach(n => n.classList.remove('clash'));
  // Focused on a place: every label inside it is placed before any outside it.
  const passes = el.classList.contains('pfocus') ? [n => !n.closest('.fz-out'), n => !!n.closest('.fz-out')] : [() => true];
  passes.forEach(pass => LABEL_PRIORITY.forEach(sel => el.querySelectorAll(sel).forEach(n => {
    if (seen.has(n) || !pass(n)) return;  // e.g. a line-end label matches both '.lbl-stn.end' and '.lbl-stn'
    seen.add(n);
    const r = n.getBoundingClientRect();
    if (!r.width || r.right < box.left || r.left > box.right || r.bottom < box.top || r.top > box.bottom) return;
    const pad = 2;
    if (kept.some(k => r.left < k.right + pad && r.right > k.left - pad && r.top < k.bottom + pad && r.bottom > k.top - pad)) n.classList.add('clash');
    else kept.push(r);
  })));
}

function label(text, cls, latlng){
  return L.tooltip({permanent:true, direction:'center', className:'lbl ' + cls, pane:'tooltipPane', interactive:false}).setLatLng(latlng).setContent(text);
}
const ll = p => [p[1], p[0]];
function hoverTip(layer, text){ layer.bindTooltip(text, {sticky:true, className:'hover-tip', direction:'top', offset:[0,-8]}); }

function polyLayer(fc, opts){
  const g = L.layerGroup();
  const geo = L.geoJSON(fc, {pane: opts.pane || 'fill', style: f => ({className: opts.cls(f), weight: 1}),
    onEachFeature: (f, lyr) => { if (opts.hover) hoverTip(lyr, opts.hover(f)); lyr.on('click', tapMap); }});
  g.addLayer(geo);
  if (opts.label) fc.features.forEach(f => { const t = opts.label(f); if (!t) return;
    const lb = label(t, opts.lcls(f), ll(f.properties.lp));
    if (opts.focusId) tapToFocus(lb, opts.focusId, f);
    g.addLayer(lb); });
  return g;
}

/* ---------- geometry helpers for "What's here" ---------- */
function inRing(x, y, r){ let ins = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++){ const xi=r[i][0], yi=r[i][1], xj=r[j][0], yj=r[j][1]; if (((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) ins = !ins; } return ins; }
function inPoly(x, y, c){ if (!inRing(x, y, c[0])) return false; for (let k = 1; k < c.length; k++) if (inRing(x, y, c[k])) return false; return true; }
function contains(geom, x, y){ if (geom.type === 'Polygon') return inPoly(x, y, geom.coordinates); if (geom.type === 'MultiPolygon') return geom.coordinates.some(c => inPoly(x, y, c)); return false; }
function hit(fc, x, y){ return fc ? fc.features.find(f => contains(f.geometry, x, y)) : null; }
function metres(a, b){ const k = Math.PI/180, dx = (a[0]-b[0])*k*Math.cos(a[1]*k)*6371000, dy = (a[1]-b[1])*k*6371000; return Math.hypot(dx, dy); }

/* ---------- build layers ---------- */
function buildBase(fc, regions){
  const g = L.geoJSON(fc, {pane:'base', interactive:false, style: f => ({className: {city:'base-city', neighbour:'base-out', outside:'base-far'}[f.properties.kind]})});
  g.addTo(map);
  fc.features.filter(f => f.properties.kind === 'neighbour').forEach(f => label(f.properties.name, 'lbl-muni', ll(f.properties.lp)).addTo(map));
  regions.features.forEach(f => label(f.properties.name, 'lbl-region', ll(f.geometry.coordinates)).addTo(map));
  (CITY.water || []).forEach(w => label(w.name, 'lbl-lake ' + w.cls, w.at).addTo(map));
  map.on('click', tapMap);
}

  streets: (it, fc) => {

    // Collectors (their own layer, under Main streets) draw thinner, from zoom 13, named from 15.
    const k = f => f.properties.cls === 'major' ? 1 : f.properties.cls === 'coll' ? .55 : .75;

      return Math.abs((B.x - A.x) * ux + (B.y - A.y) * uy) < ext(A) + ext(B);

      const SP = z < 13 ? 420 : z < 14 ? 340 : 280;
      // Keep clear of other labels, shields and the panels floating over the map.
      const mr = map.getContainer().getBoundingClientRect();
      // A layer that yields (collectors) also keeps clear of the main streets' names, placed just before.
      document.querySelectorAll('#search, #here, #panel, .leaflet-tooltip.lbl, .shield, .lm i, .lm b, .stn, .leaflet-pin-pane > *' + (it.yieldLabels ? ', .st-lbl:not(.coll)' : '')).forEach(el => {
        const r = el.getBoundingClientRect();

      });

          const total = d[d.length-1];

            if (a.distanceTo(b) < tw * .94) continue;               // too curvy here

  if (!m.length){ showResults(''); return; }
  showSuggestions(m, true);
});
q.addEventListener('keydown', e => { if (e.key === 'ArrowDown'){ const b = results.querySelector('button'); if (b){ e.preventDefault(); b.focus(); } } });
results.addEventListener('keydown', e => {
  const bs = [...results.querySelectorAll('button')], i = bs.indexOf(document.activeElement);
  if (e.key === 'ArrowDown' && i < bs.length - 1){ e.preventDefault(); bs[i + 1].focus(); }
  if (e.key === 'ArrowUp'){ e.preventDefault(); (i > 0 ? bs[i - 1] : q).focus(); }
  if (e.key === 'Escape'){ showResults(''); q.focus(); }
});

/* ---------- Scope: the wider region ("outer") or the city alone ("inner") ---------- */
let mask = null, scope = 'outer';
function frame(bounds){
  const opts = wide() ? {paddingTopLeft:[330,20], paddingBottomRight:[350,20]} : {paddingTopLeft:[0,150], paddingBottomRight:[0,90]};
  const size = map.getSize(), calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (calm || !size.x || !size.y) map.fitBounds(bounds, Object.assign({animate:false}, opts));
  else map.flyToBounds(bounds, Object.assign({duration:.8}, opts));
}
function setScope(s, move){
  scope = s;
  document.querySelectorAll('[data-scope]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.scope === s)));
  map.getContainer().classList.toggle('mode-inner', s === 'inner');
  if (mask) { if (s === 'inner') mask.addTo(map); else map.removeLayer(mask); }
  ORDER.forEach(it => { if (layers[it.id] && layers[it.id]._scope) layers[it.id]._scope(s); });
  if (SUBURBS){
    document.getElementById('row-' + SUBURBS.id).hidden = s === 'inner';
    document.getElementById('drvbox').hidden = s === 'inner' || !state[SUBURBS.id];
    const lyr = layers[SUBURBS.id];
    if (lyr){ if (s === 'outer' && state[SUBURBS.id]) lyr.addTo(map); else map.removeLayer(lyr); }
  }
  const fb = document.getElementById('focusBox');
  if (fb) fb.hidden = s === 'inner';
  if (s === 'inner' && focusKey) setFocus(null, false);
  if (s === 'outer' && placeF) setPlaceFocus(null, null, false);
  if (move) frame(s === 'inner' ? CITY_BOUNDS : REGION_VIEW);
  queueDeclutter();
  queueHash();
}

/* ---------- Focus on one county or region (regional view) ----------
   Picking one (from the panel, search, or a spot's card) outlines it, dims everything outside it, frames
   the map on it, labels every municipality inside and lists them in the panel. Outlines come from
   region_areas.geojson (engine/regions.py); municipalities belong to the region named on them in base. */
let focusKey = null, focusLayer = null;
const regionName = k => fill(CITY.outside.regionPill, {region: k}) || k;
const regionFeature = k => k && CITY.focus && data.regionAreas ? data.regionAreas.features.find(f => f.properties.region === k) : null;
function buildFocusUI(){
  if (!CITY.focus || !data.regionAreas) return;
  const keys = data.regionAreas.features.map(f => f.properties.region).sort((a, b) => regionName(a).localeCompare(regionName(b)));
  const box = document.createElement('div'); box.className = 'focus'; box.id = 'focusBox'; box.hidden = scope !== 'outer';
  box.innerHTML = '<label for="focusSel">' + esc(CITY.focus.label) + '</label><select id="focusSel"><option value="">' + esc(CITY.focus.all) + '</option>' +
    keys.map(k => '<option value="' + esc(k) + '">' + esc(regionName(k)) + '</option>').join('') + '</select>' +
    '<div class="focus-res" id="focusRes" hidden><span id="focusCount"></span><button type="button" id="focusClear">Show all</button></div><div class="flist focus-list" id="focusList" hidden></div>';
  document.querySelector('.scope').after(box);
  box.querySelector('select').addEventListener('change', e => setFocus(e.target.value || null, true));
  box.querySelector('#focusClear').addEventListener('click', () => setFocus(null, true));
}
function setFocus(key, move){
  const f = regionFeature(key);
  if (key && !f) return;
  if (f && scope === 'inner') setScope('outer', false);
  focusKey = f ? key : null;
  if (focusLayer){ map.removeLayer(focusLayer); focusLayer = null; }
  map.getContainer().classList.toggle('focused', !!f);
  const sel = document.getElementById('focusSel'); if (sel) sel.value = focusKey || '';
  const list = document.getElementById('focusList'), res = document.getElementById('focusRes');
  if (!f){
    if (list){ list.hidden = true; res.hidden = true; list.innerHTML = ''; }
    if (move) frame(REGION_VIEW);
    queueDeclutter(); queueHash(); return;
  }
  focusLayer = L.layerGroup();
  // Dim everything outside: a sheet over the whole map with the region cut out of it.
  const v = CITY.view.max, sheet = [[v[0][0] - 5, v[0][1] - 5], [v[0][0] - 5, v[1][1] + 5], [v[1][0] + 5, v[1][1] + 5], [v[1][0] + 5, v[0][1] - 5]];
  const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
  focusLayer.addLayer(L.polygon([sheet].concat(polys.map(p => p[0].map(ll))), {pane: 'mask', interactive: false, className: 'focus-dim'}));
  focusLayer.addLayer(L.geoJSON(f, {pane: 'focus', interactive: false, style: () => ({className: 'focus-line'})}));
  // Every municipality in it, biggest first so they win the label declutter.
  const size = g => { const b = L.geoJSON(g).getBounds(); return (b.getEast() - b.getWest()) * (b.getNorth() - b.getSouth()); };
  const towns = data.outer.features.filter(t => t.properties.region === key && !t.properties.rest);
  towns.slice().sort((a, b) => size(b) - size(a)).forEach(t => focusLayer.addLayer(label(esc(t.properties.name), 'lbl-focus', ll(t.properties.lp))));
  focusLayer.addTo(map);
  // The list in the panel: tap a name to go there.
  const sorted = towns.slice().sort((a, b) => a.properties.name.localeCompare(b.properties.name));
  document.getElementById('focusCount').textContent = fill(CITY.focus.count, {n: sorted.length, name: regionName(key)});
  list.innerHTML = '';
  sorted.forEach(t => {
    const b = document.createElement('button'); b.type = 'button';
    b.innerHTML = esc(t.properties.name) + (t.properties.drive != null ? '<span>' + t.properties.drive + ' min</span>' : '');
    b.title = t.properties.drive != null ? 'About ' + t.properties.drive + ' min to ' + CITY.drive.hubName + ' with no traffic' : '';
    b.addEventListener('click', () => {
      const p = PLACES.find(x => x.f === t);
      if (matchMedia('(max-width:760px)').matches) panel.classList.add('collapsed');
      if (p) goPlace(p);
    });
    list.appendChild(b);
  });
  list.hidden = false; res.hidden = false;
  if (move){
    frame(L.geoJSON(f).getBounds());
    // On a phone, clear the way: fold the panel (the picker stays) and close the card.
    if (matchMedia('(max-width:760px)').matches){ panel.classList.add('collapsed'); closeHere(); }
  }
  queueDeclutter(); queueHash();
}
document.querySelectorAll('[data-scope]').forEach(b => b.addEventListener('click', () => { if (b.dataset.scope !== scope) setScope(b.dataset.scope, true); }));

/* ---------- Focus on one place (city view) ----------
   Tap a neighbourhood's or area's name on the map, or "Focus on" on the card, and everything outside the
   place dims. Two sheets with the place cut out do it: a strong one under the trains and routes (fills, streets,
   boundaries), a lighter one over them, so a line that passes through stays full inside and half-faded outside,
   and you can follow it to where it ends. Lines that don't pass through fade right out; points and labels
   outside fade (names of places and stations less, so you can read where a route goes). The panel lists the
   lines, main streets and landmarks in or through the place. Tap outside it, press Escape or Exit to leave.
   Kept in links as focus=<layer id>:<name>. */
var placeF = null, pfLayer = null, pfBox = null, pfMemo = new WeakMap();
const PF_KINDS = ['units', 'fill'];
const pfLayers = () => LAYERS.filter(it => PF_KINDS.includes(it.kind)).sort((a, b) => (a.kind === 'units' ? 0 : a.size === 'major' ? 2 : 1) - (b.kind === 'units' ? 0 : b.size === 'major' ? 2 : 1));
const pfFeature = (id, name) => { const fc = data.layers[id]; return fc ? fc.features.find(f => f.properties.name === name) : null; };
function placeFromLink(v){
  if (!v || !v.includes(':')) return null;
  const i = v.indexOf(':'), id = v.slice(0, i), name = v.slice(i + 1);
  return pfLayers().some(it => it.id === id) && pfFeature(id, name) ? [id, name] : null;
}
// What a place's layer calls one of its own (Neighbourhood, Former city, Side of the city).
const pfNoun = it => it.kind === 'units' ? CITY.units.singular : (it.place || it.name);
function tapToFocus(lb, id, f){
  lb.on('add', () => {
    const el = lb.getElement(); if (!el || el._pf) return;
    el._pf = true; el.classList.add('lbl-tap'); el.title = 'Focus on ' + f.properties.name;
    L.DomEvent.on(el, 'click', ev => {
      L.DomEvent.stop(ev);
      if (map.dragging && map.dragging.moved()) return;
      setPlaceFocus(id, f.properties.name, true);
    });
  });
}
// A tap on the map: outside the focused place it only leaves focus (no card); otherwise the card as usual.
function tapMap(e){
  if (placeF && !inPlace(e.latlng.lng, e.latlng.lat)){
    if (!swallowTap){ swallowTap = true; setPlaceFocus(null, null, false); setTimeout(() => { swallowTap = false; }); }
    return;
  }
  inspect(e.latlng);
}
function inPlace(x, y){
  const b = placeF.bb;
  return x >= b[0] && x <= b[2] && y >= b[1] && y <= b[3] && contains(placeF.f.geometry, x, y);
}
// Does a line (any coordinates: LineString or MultiLineString) pass through the place? A vertex inside, or a
// segment crossing its edge, counts; so does running along it, as a boundary street does.
function crosses(a, b, c, d){
  const o = (p, q, r) => Math.sign((q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]));
  return o(a, b, c) !== o(a, b, d) && o(c, d, a) !== o(c, d, b);
}
function lineMeets(geom){
  const b = placeF.bb, parts = geom.type === 'LineString' ? [geom.coordinates] : geom.type === 'MultiLineString' ? geom.coordinates : [];
  for (const c of parts) for (let i = 0; i < c.length; i++){
    const p = c[i];
    if (p[0] >= b[0] && p[0] <= b[2] && p[1] >= b[1] && p[1] <= b[3] && contains(placeF.f.geometry, p[0], p[1])) return true;
    if (!i) continue;
    const q = c[i - 1];
    if (Math.max(p[0], q[0]) < b[0] || Math.min(p[0], q[0]) > b[2] || Math.max(p[1], q[1]) < b[1] || Math.min(p[1], q[1]) > b[3]) continue;
    for (const r of placeF.rings) for (let k = 1; k < r.length; k++) if (crosses(q, p, r[k - 1], r[k])) return true;
  }
  return false;
}
// The routes (indices into transit.json) with a stop inside the place.
function placeRoutes(){
  if (!placeF.ri && data.transit){ placeF.ri = new Set(); data.transit.stops.forEach(s => { if (inPlace(s[0], s[1])) s[3].forEach(i => placeF.ri.add(i)); }); }
  return placeF.ri || new Set();
}
const featMeets = f => { if (!pfMemo.has(f)) pfMemo.set(f, lineMeets(f.geometry)); return pfMemo.get(f); };
// Sort one map layer into in / out as it joins the map.
const PF_LINE_PANES = ['rail', 'transit'], PF_PT_PANES = ['pts', 'stlbl', 'tooltipPane'];
function pfSort(l){
  if (!placeF || l === pfLayer || !l.options) return;
  const pane = l.options.pane || (l instanceof L.Tooltip ? 'tooltipPane' : l instanceof L.Marker ? 'markerPane' : 'overlayPane');
  const el = l._path || l._icon || (l.getElement && l.getElement());
  if (!el || /hover-tip/.test(l.options.className || '')) return;
  let cls = null;
  const f = l.feature || l.options.feat, picked_ = / (pick|focus)\b/.test(l.options.className || '') || (l._icon && l._icon.querySelector('.pick, .focus'));
  if (l instanceof L.Polyline && !(l instanceof L.Polygon)){
    if (!PF_LINE_PANES.includes(pane)) return;
    if (!picked_ && !(f ? featMeets(f) : lineMeets({type: 'LineString', coordinates: l.getLatLngs().flat(Infinity).map(p => [p.lng, p.lat])}))) cls = 'fz-off';
  } else if (l.getLatLng && PF_PT_PANES.includes(pane)){
    const p = l.getLatLng(); if (!p) return;
    if (f && !picked_ && !featMeets(f)) cls = 'fz-off';         // a route's number badge: hidden if the route doesn't pass through
    else if (l.options.stopOf && !picked_ && !inPlace(p.lng, p.lat) && !l.options.stopOf.some(i => placeRoutes().has(i))) cls = 'fz-off';   // a stop no route through the place serves
    else if (!inPlace(p.lng, p.lat)) cls = 'fz-out';
  } else return;
  el.classList.remove('fz-off', 'fz-out');
  if (cls) el.classList.add(cls);
}
map.on('layeradd', e => { if (placeF) pfSort(e.layer); });
function setPlaceFocus(id, name, move){
  const f = id ? pfFeature(id, name) : null;
  const same = f && placeF && placeF.id === id && placeF.name === name;
  if (pfLayer){ map.removeLayer(pfLayer); pfLayer = null; }
  map.getContainer().querySelectorAll('.fz-off, .fz-out').forEach(n => n.classList.remove('fz-off', 'fz-out'));
  placeF = null; pfMemo = new WeakMap();
  if (!f || (same && move)){
    map.getContainer().classList.remove('pfocus');
    drawPlaceBox();
    if (lastInspect && !here.hidden) inspect(...lastInspect);
    queueDeclutter(); queueHash(); return;
  }
  if (scope !== 'inner') setScope('inner', false);
  const polys = f.geometry.type === 'Polygon' ? [f.geometry.coordinates] : f.geometry.coordinates;
  const rings = polys.flat(), xs = rings.flat().map(p => p[0]), ys = rings.flat().map(p => p[1]);
  placeF = {id, name, f, rings, bb: [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)], it: LAYERS.find(it => it.id === id)};
  map.getContainer().classList.add('pfocus');
  pfLayer = L.layerGroup();
  const v = CITY.view.max, sheet = [[v[0][0] - 5, v[0][1] - 5], [v[0][0] - 5, v[1][1] + 5], [v[1][0] + 5, v[1][1] + 5], [v[1][0] + 5, v[0][1] - 5]];
  const holes = polys.map(p => p[0].map(ll));
  pfLayer.addLayer(L.polygon([sheet].concat(holes), {pane: 'pfdim', interactive: false, className: 'pf-dim'}));
  pfLayer.addLayer(L.polygon([sheet].concat(holes), {pane: 'pfdim2', interactive: false, className: 'pf-dim2'}));
  pfLayer.addLayer(L.geoJSON(f, {pane: 'pfline', interactive: false, style: () => ({className: 'pf-line'})}));
  pfLayer.addTo(map);
  map.eachLayer(pfSort);
  drawPlaceBox();
  if (move){
    frame(L.geoJSON(f).getBounds());
    // On a phone, clear the way to the map; the panel keeps a one-line reminder with Exit.
    if (!wide()){ panel.classList.add('collapsed'); closeHere(); }
  }
  if (lastInspect && !here.hidden) inspect(...lastInspect);
  queueDeclutter(); queueHash();
}
// The card's "Focus on" chips: the unit, then the areas it sits in.
function focusChips(hits){
  const ls = pfLayers().filter(it => hits[it.id]);
  if (!ls.length) return '';
  return '<div class="pfgo"><small>Focus on</small>' + ls.map(it => {
    const n = hits[it.id].properties.name, on = placeF && placeF.id === it.id && placeF.name === n;
    return '<button type="button" data-pf="' + esc(it.id + ':' + n) + '" aria-pressed="' + !!on + '" title="' + esc(pfNoun(it)) + '">' + esc(n) + (on ? ' ×' : '') + '</button>';
  }).join('') + '</div>';
}
/* The panel box: what's in or passes through the place, from the data (whichever layers are on).
   Rapid transit and trains by line; streetcars and buses with a stop inside, as chips that draw the route;
   main streets in or along it; landmarks and institutions inside. */
function drawPlaceBox(){
  if (!pfBox){
    pfBox = document.createElement('div'); pfBox.className = 'pfbox'; pfBox.id = 'pfBox'; pfBox.hidden = true;
    document.querySelector('.scope').after(pfBox);
  }
  if (!placeF){ pfBox.hidden = true; pfBox.innerHTML = ''; return; }
  const rows = [], names = a => [...new Set(a)];
  const lineRow = (it, fc, cls) => {
    if (!fc) return;
    const hitL = fc.features.filter(f => /Line/.test(f.geometry.type) && featMeets(f));
    if (hitL.length) rows.push([it.name, '<span class="pf-lines">' + names(hitL.map(f => f.properties.name)).map(n => '<span' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(n) + '</span>').join('') + '</span>']);
  };
  LAYERS.filter(it => it.kind === 'metro').forEach(it => lineRow(it, loaded[[].concat(it.files)[0]]));
  LAYERS.filter(it => it.kind === 'rail').forEach(it => lineRow(it, loaded[[].concat(it.files)[0]]));
  const T = data.transit;
  if (TR && T){
    const rs = [...placeRoutes()].map(i => T.routes[i]).sort((a, b) => String(a.r).localeCompare(String(b.r), undefined, {numeric: true}));
    const chip = r => '<button type="button" class="rt-chip ' + r.m + (r.f.includes('freq') ? ' freq' : '') + '" data-route="' + esc(r.r) + '" aria-pressed="' + picked.has(r.r) + '" title="' + routeTip(r) + '">' + esc(r.r) + '</button>';
    TR.rows.forEach(([mode, label]) => { const x = rs.filter(r => r.m === mode && r.day); if (x.length) rows.push([label, '<span class="rt-chips">' + x.map(chip).join('') + '</span>']); });
    const night = rs.filter(r => r.f.includes('night'));
    if (night.length) rows.push([TR.night, '<span class="rt-chips">' + night.map(chip).join('') + '</span>']);
  }
  LAYERS.filter(it => it.kind === 'construction').forEach(it => lineRow(it, loaded[it.file], 'uc'));
  LAYERS.filter(it => it.kind === 'streets' && !it.under).forEach(it => {
    const fc = loaded[it.file]; if (!fc) return;
    const st = fc.features.filter(featMeets).sort((a, b) => a.properties.name.localeCompare(b.properties.name));
    const nm = names(st.map(f => f.properties.name)), cap = 14;
    if (nm.length) rows.push([it.name, esc(nm.slice(0, cap).join(', ')) + (nm.length > cap ? ' <span class="more">and ' + (nm.length - cap) + ' more</span>' : '')]);
  });
  // Points inside: landmarks, then each institution layer, then skyscrapers (counted, tallest named).
  const ptsIn = fc => fc ? fc.features.filter(f => f.geometry.type === 'Point' && inPlace(f.geometry.coordinates[0], f.geometry.coordinates[1])) : [];
  const btn = f => '<button type="button" data-pt="' + f.geometry.coordinates.join(',') + '" data-name="' + esc(f.properties.name) + '">' + esc(f.properties.name) + (f.properties.sub ? ' <small>' + esc(f.properties.sub) + '</small>' : '') + '</button>';
  LAYERS.filter(it => it.kind === 'landmarks').forEach(it => { const p = ptsIn(loaded[it.file]); if (p.length) rows.push([it.name, '<span class="flist">' + p.map(btn).join('') + '</span>']); });
  LAYERS.filter(it => it.kind === 'places').forEach(it => { const p = ptsIn(loaded[it.file]).filter(f => !it.cat || f.properties.cat === it.cat); if (p.length) rows.push([it.name, '<span class="flist">' + p.map(btn).join('') + '</span>']); });
  LAYERS.filter(it => it.kind === 'towers').forEach(it => {
    const p = ptsIn(loaded[it.file]).sort((a, b) => b.properties.h - a.properties.h);
    if (p.length) rows.push([it.name, p.length + (p.length > 1 ? ' · tallest ' : ' · ') + btn(p[0]).replace('<button', '<button class="inline"')]);
  });
  pfBox.hidden = false;
  pfBox.innerHTML = '<div class="pf-head"><div><small>Focused on · ' + esc(pfNoun(placeF.it)) + '</small><b>' + esc(placeF.name) + '</b></div>' +
    '<button type="button" id="pfExit">Exit focus</button></div>' +
    '<div class="pf-inv">' + (rows.length ? '<dl>' + rows.map(([k, v]) => '<dt>' + esc(k) + '</dt><dd>' + v + '</dd>').join('') + '</dl>' : '') +
    '<p>' + esc(TR && T ? 'Lines and routes that pass through, and streets in or along it. Routes have a stop inside. Tap a number to draw it.' : 'Lines that pass through, and streets in or along it.') + '</p></div>';
  pfBox.querySelector('#pfExit').onclick = () => setPlaceFocus(null, null, true);
  pfBox.querySelectorAll('[data-route]').forEach(b => b.addEventListener('click', () => { pickRoute(b.dataset.route, !picked.has(b.dataset.route)); b.setAttribute('aria-pressed', String(picked.has(b.dataset.route))); }));
  pfBox.querySelectorAll('[data-pt]').forEach(b => b.addEventListener('click', () => {
    const [x, y] = b.dataset.pt.split(',').map(Number);
    if (!wide()) panel.classList.add('collapsed');
    goTo(L.latLng(y, x), b.dataset.name, false);
  }));
}



/* ---------- Shareable links: the view lives in the address bar's #fragment ----------
   #map=zoom/lat/lng&pin=lat,lng&name=…&view=region&layers=a,b&lens=commute&fit=cost:lower+middle,union:30
   Anything left out means the starting setting, so old links keep working as defaults change.
   Layers are named by their short ids in city.json; renaming a layer's label doesn't break links.
   The fragment never reaches a server, and replaceState keeps the Back button clean. */
var linkReady = false, hashTimer = 0, lastHash = '';   // var: the panel's handlers can reach these before this line runs
const SHARE_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10V2.5M5 5.2 8 2.2l3 3M4.5 7.5H3.5v6h9v-6h-1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const enc = v => encodeURIComponent(v).replace(/%2C/g, ',').replace(/%2F/g, '/').replace(/%3A/g, ':').replace(/%2B/g, '+');
const SUBS = LAYERS.filter(it => it.sub).map(it => it.sub);
// Start keeping the address bar in step at the next touch, click, key or scroll, so a plain visit
// (or one just reset) stays a plain URL until someone actually changes something. Set after this
// event's own handlers, so the gesture that armed it doesn't count.
function armLink(){
  const ev = ['pointerdown', 'keydown', 'wheel'];
  const start = () => { ev.forEach(e => removeEventListener(e, start, true)); linkReady = true; };
  setTimeout(() => ev.forEach(e => addEventListener(e, start, true)), 1200);
}
function queueHash(){ if (linkReady){ clearTimeout(hashTimer); hashTimer = setTimeout(writeHash, 250); } }
function linkState(){
  const c = map.getCenter(), z = map.getZoom();
  const parts = [['map', (Math.round(z * 4) / 4) + '/' + c.lat.toFixed(5) + '/' + c.lng.toFixed(5)]];
  if (pin && !pinIsMe){ const p = pin.getLatLng(); parts.push(['pin', p.lat.toFixed(5) + ',' + p.lng.toFixed(5)]); if (pinName) parts.push(['name', pinName]); }
  if (scope === 'outer') parts.push(['view', 'region']);
  if (focusKey) parts.push(['focus', focusKey]);
  if (placeF) parts.push(['focus', placeF.id + ':' + placeF.name]);
  const on = LAYERS.filter(it => state[it.id]).map(it => it.id)
    .concat(SUBS.filter(s => document.getElementById(s.id).checked).map(s => s.id));

  // Attendance areas are big: fetched after the map is up, then the open card is redrawn with them.
  if (CITY.card.schools) get(CITY.card.schools.file).then(d => {
    data.schools = d;
    if (!here.hidden && lastInspect && hit(data.footprint, lastInspect[0].lng, lastInspect[0].lat)) inspect(...lastInspect);
  }).catch(() => { data.schools = null; });
}).catch(err => { renderEmpty('The map data didn’t load (' + err.message + '). Reload the page to try again.'); });
})();

</script>
