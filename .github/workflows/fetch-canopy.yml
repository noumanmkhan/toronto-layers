name: Fetch tree canopy
# Works out each unit's tree canopy share from open land-cover rasters (engine/fetch_canopy.py,
# cities/<city>/canopy.json) and commits cities/<city>/raw/canopy/. Large downloads (Toronto's 2018
# land cover is ~450 MB), so it runs only when the script or a canopy.json changes on main, or by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['engine/fetch_canopy.py', 'cities/*/canopy.json', '.github/workflows/fetch-canopy.yml']
permissions:
  contents: write
concurrency: fetch-canopy
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin > /dev/null && gdalinfo --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q rasterio shapely pyproj numpy
      - run: |
          for c in toronto chicago; do
            mkdir -p cities/$c/raw/canopy
            python3 -u engine/fetch_canopy.py $c 2>&1 | tee cities/$c/raw/canopy/fetch.log || true
          done
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add cities/toronto/raw/canopy cities/chicago/raw/canopy
          git commit -m "Tree canopy per unit from open land cover" || echo "no changes"
          git pull --rebase
          git push
