name: Fetch streetcar and bus routes
# Downloads each city's agency GTFS (cities/<city>/surface.json), and any other agencies it lists under
# "feeds" (Toronto: GO buses). When the feed has changed since the
# last run, rewrites cities/<city>/raw/surface/ (routes, stops, trips-per-hour counts), rebuilds the
# published transit files with engine/surface.py (docs/<city>/data/transit.json, transit_routes.geojson,
# streetcars.geojson) and commits both to main, so the site picks up new schedules without a manual
# rebuild. Same feed as last time: nothing is committed.
# Runs weekly (Mondays; the TTC and CTA post new schedules a few days before each service change),
# when the fetch or build script or a surface.json changes on main, or by hand.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 7 * * 1'
  push:
    branches: [main]
    paths: ['engine/fetch_surface.py', 'engine/surface.py', 'cities/*/surface.json', '.github/workflows/fetch-surface.yml']
permissions:
  contents: write
concurrency: fetch-surface
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely
      - name: Fetch, and rebuild where a feed changed
        run: |
          for c in toronto chicago; do
            changed=
            # The city's own agency, then any others listed under "feeds" in its surface.json (e.g. GO buses).
            for f in "" $(python3 -c "import json; print(' '.join(json.load(open('cities/$c/surface.json')).get('feeds', {})))"); do
              d=cities/$c/raw/surface${f:+/$f}; mkdir -p $d
              python3 -u engine/fetch_surface.py $c $f 2>&1 | tee /tmp/fetch-$c-$f.log || true
              # A new feed (changed or first fetched): keep its log.
              if [ -n "$(git status --porcelain -- $d/routes.json)" ]; then cp /tmp/fetch-$c-$f.log $d/fetch.log; changed=1; fi
            done
            # Rebuild when a feed changed; otherwise only on a push or a run by hand (the build may have changed).
            if [ -n "$changed" ] || [ "${{ github.event_name }}" != "schedule" ]; then python3 -u engine/surface.py $c; fi
          done
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add cities/toronto/raw/surface cities/chicago/raw/surface
          for c in toronto chicago; do git add docs/$c/data/transit.json docs/$c/data/transit_routes.geojson; [ -f docs/$c/data/streetcars.geojson ] && git add docs/$c/data/streetcars.geojson; done
          git commit -m "Update streetcar and bus routes from the agencies' latest schedules" || echo "no changes"
          git pull --rebase
          git push
