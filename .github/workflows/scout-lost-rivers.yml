name: Scout lost rivers
# One-off check of buried and lost waterways mapped in OpenStreetMap (Toronto, Chicago). Writes
# scouting/lost-rivers/out/ and commits it to main. Doesn't touch the site.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scouting/lost-rivers/scout.py']
permissions:
  contents: write
concurrency: scout-lost-rivers
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          mkdir -p scouting/lost-rivers/out
          python3 -u scouting/lost-rivers/scout.py 2>&1 | tee scouting/lost-rivers/out/scout.log || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add scouting/lost-rivers/out
          git commit -m "Lost rivers scouting report" || echo "no changes"
          git pull --rebase
          git push
